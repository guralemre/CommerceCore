server:
  port: 8080

spring:
  application:
    name: commerce-core
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:commercecore}
    username: ${DB_USERNAME:commercecore}
    password: ${DB_PASSWORD:commercecore}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  jackson:
    default-property-inclusion: non_null

jwt:
  secret: ${JWT_SECRET:change-me-dev-only-secret-key-please-override-in-prod-min-256-bits}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

logging:
  level:
    com.commercecore: INFO
