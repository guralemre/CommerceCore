services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: commercecore
      POSTGRES_USER: commercecore
      POSTGRES_PASSWORD: commercecore
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commercecore"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: commercecore
      DB_USERNAME: commercecore
      DB_PASSWORD: commercecore
      JWT_SECRET: ${JWT_SECRET:-change-me-dev-only-secret-key-please-override-in-prod-min-256-bits}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
